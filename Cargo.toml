[package]
name = "xtream"
version = "0.1.0"
edition = "2021"
build = "build.rs"


[dependencies]
serde = { version = "1.0", features = ["derive"] }
sled = "0.34"
tokio = { version = "1.0", features = ["full"] }
egui = "0.30.0"
egui_extras = {version = "0.30.0" , features = ["default", "all_loaders"]}
egui-wgpu = "0.30.0"
eframe = {version = "0.30.0"}
serde_json = "1.0"
image = {version = "0.25.5", features = ["jpeg", "png"]}
futures = "0.3.31"
bincode = "1.3.3"
env_logger = "0.11.6"
log = "0.4.22"
unicode-bidi = "0.3.18"
harfbuzz = "=0.4"
rustybuzz = "0.20.1"
arabic_reshaper = "0.4.2"
isahc = "1.7.2"
sha2 = "0.10.8"
derivative = "2.2.0"
regex = "1.11.1"
slint = "1.9.1"
async-compat = "0.2.4"

[build-dependencies]
slint-build = "1.9.1"